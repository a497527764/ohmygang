[package]
name = "ohmygang-relay"
version = "0.1.0"
description = "OH-MY-GANG! 自有云端中继 + 队伍码服务（Nostr 风格中继、6 位短码分配、5 天自动回收）"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
chrono = "0.4"
rand = "0.10"
sha2 = "0.11"
hkdf = "0.13"
futures-util = "0.3"
base64 = "0.23"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
