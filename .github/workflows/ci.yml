# 每次推送和拉取请求：在 Windows、macOS（Apple 芯片）上构建前端、检查 Rust 格式和 clippy、跑全部 Rust 测试。
# macOS 的键鼠监听是实验版：CI 保证它能编译、纯逻辑测试能过；真机上要人测。3.1 起不再支持 Linux。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的新推送取消旧的运行：新提交包含旧提交。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Tauri 编译时要读前端产物（dist/），所以先构建前端；tsc 顺便做类型检查。
      - run: pnpm build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 格式
        working-directory: src-tauri
        run: cargo fmt --check
      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: 测试
        working-directory: src-tauri
        run: cargo test
