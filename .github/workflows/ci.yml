# 每次推送和拉取请求：在 Windows、macOS（Apple 芯片）、Ubuntu 上构建前端、检查 Rust 格式和 clippy、跑全部 Rust 测试。
# macOS 和 Linux 的键鼠监听在 2.0-M6 之前是空实现，这里只保证它们能编译、纯逻辑测试能过（架构第 10 节）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的新推送取消旧的运行：新提交包含旧提交。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux 系统库（WebKitGTK、托盘、OpenSSL、D-Bus）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev pkg-config

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Tauri 编译时要读前端产物（dist/），所以先构建前端；tsc 顺便做类型检查。
      - run: pnpm build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 格式
        working-directory: src-tauri
        run: cargo fmt --check
      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: 测试
        working-directory: src-tauri
        run: cargo test
