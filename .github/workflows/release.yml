# 发版：推送 v 开头的标签（比如 v2.0.0）时运行。Windows、macOS 各自打包、给更新包签名，全部成功后才建 Release，
# 上传安装包和 latest.json（已安装的程序从 releases/latest/download/latest.json 查新版本）。
# 需要仓库 Secrets：TAURI_SIGNING_PRIVATE_KEY（更新私钥文件的内容）和 TAURI_SIGNING_PRIVATE_KEY_PASSWORD（生成私钥时设的密码）。
# 更新说明取自带注释的标签：git tag -a v2.0.0 -m "这一版改了什么"。macOS 是实验版；3.1 起不再出 Linux 的包。
name: 发版

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            bundles: nsis
          - os: macos-latest
            platform: macos
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 版本号和标签一致、更新公钥已填
        run: node scripts/release.mjs check "${{ github.ref_name }}"

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri.release.conf.json 打开 createUpdaterArtifacts：用私钥给更新包签名（本机 pnpm release 不签）
      - name: 检查签名密钥
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then echo "::error::TAURI_SIGNING_PRIVATE_KEY secret 未配置"; exit 1; fi
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" ]; then echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret 未配置"; exit 1; fi
          echo "---"
          echo "密钥前 20 字符（仅显示前缀）："
          echo -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" | head -c 20
          echo "..."
          echo "密钥总长度：$(echo -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" | wc -c) 字节"
          echo "密钥首行：$(echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" | head -1)"
          echo "密钥行数：$(echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" | wc -l)"
      - name: 打包并签名
        shell: bash
        run: |
          set -o pipefail
          pnpm tauri build --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }} 2>&1 | tee build.log
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: 上传构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.platform }}
          path: build.log
          if-no-files-found: ignore

      - run: node scripts/release.mjs collect ${{ matrix.platform }} out
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: out/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - name: 更新说明（标签的注释）
        run: |
          git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          git for-each-ref "refs/tags/${{ github.ref_name }}" --format='%(contents)' > notes.md
          if [ ! -s notes.md ]; then echo "OH-MY-GANG! ${{ github.ref_name }}" > notes.md; fi
      - run: node scripts/release.mjs manifest out "${{ github.ref_name }}" notes.md
      - name: 建 Release 并上传
        run: gh release create "${{ github.ref_name }}" out/* --title "OH-MY-GANG! ${{ github.ref_name }}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 同步更新包到国内中继
        env:
          RELAY_UPLOAD_TOKEN: ${{ secrets.RELAY_UPLOAD_TOKEN }}
        continue-on-error: true
        run: |
          # 没配置凭证就跳过（首次发版或不想启用中继时），不影响发版本身。
          # 海外 runner 向国内中继传大包可能超时——这一步失败只告警不拦截发版，
          # 之后在国内本机补跑即可：RELAY_UPLOAD_TOKEN=… GH_MIRROR=https://ghfast.top/ node scripts/release.mjs mirror <标签>
          if [ -z "$RELAY_UPLOAD_TOKEN" ]; then
            echo "::notice::未配置 RELAY_UPLOAD_TOKEN，跳过国内中继同步"
          else
            node scripts/release.mjs mirror "${{ github.ref_name }}"
          fi
