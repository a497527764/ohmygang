<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>lolGang</title>
  </head>
  <body>
    <section class="chat">
      <header class="cap">
        <div class="tabs" role="tablist" aria-label="只看">
          <button type="button" role="tab" data-filter="all" aria-selected="true">全部</button>
          <button type="button" role="tab" data-filter="text" aria-selected="false">文字</button>
          <button type="button" role="tab" data-filter="voice" aria-selected="false">语音</button>
          <button type="button" role="tab" data-filter="signal" aria-selected="false">信号</button>
        </div>
        <button type="button" id="close" aria-label="收起" title="收起">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <path d="M3 3 L15 15 M15 3 L3 15" />
          </svg>
        </button>
      </header>
      <ol id="log" aria-live="polite"></ol>
      <form class="box">
        <div class="line">
          <input id="message" type="text" autocomplete="off" spellcheck="false" placeholder="发消息" aria-label="对队友说的话" title="/ff 投降　/noff 反对　/ready 准备确认" />
          <span id="count" hidden></span>
          <button type="button" id="send" aria-label="发送" title="发送">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 12 H19 M13 6 L19 12 L13 18" />
            </svg>
          </button>
        </div>
        <div id="hint"></div>
      </form>
    </section>
    <script type="module" src="/src/text/main.ts"></script>
  </body>
</html>
