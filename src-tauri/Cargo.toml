[package]
name = "lolgang"
version = "2.0.2"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lolgang_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hkdf = "0.13"
chacha20poly1305 = "0.11"
ed25519-dalek = "3"
getrandom = "0.4"
thiserror = "2"
ciborium = "0.2"
serde_bytes = "0.11"
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
keyring = "4"
tokio = { version = "1", features = ["net", "time", "sync", "macros", "rt-multi-thread"] }
if-addrs = "0.15"
k256 = { version = "0.14", features = ["schnorr"] }
base64 = "0.23"
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
cpal = "0.18"
opus-rs = "0.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_SystemInformation"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xinput", "xtest", "xkb"] }

[dev-dependencies]
minisign = "0.10.0"
tauri = { version = "2", features = ["test"] }
